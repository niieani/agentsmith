name: Publish release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing v* release tag to publish
        required: true
        type: string
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* release tag to republish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Validate release metadata
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          version="${TAG#v}"
          package_version="$(jq -r .version package.json)"
          test "$version" = "$package_version"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: resolve
    runs-on: macos-14
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v2

      - name: Load Apple credential metadata
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_NOTARY_ISSUER_ID: op://Automation/Apple Developer App Store Connect AuthKey Github Releases/NOTARY_ISSUER_ID
          APPLE_NOTARY_KEY_ID: op://Automation/Apple Developer App Store Connect AuthKey Github Releases/NOTARY_KEY_ID
          APPLE_SIGN_PASSWORD: op://Automation/Apple Release Signing Developer ID Certificate/password

      - name: Build macOS ARM64 binary
        run: bun run release:build -- --target darwin-arm64 --version "$VERSION" --prepare-only

      - name: Sign and notarize macOS binary
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          temp_dir="$(mktemp -d)"
          keychain_path="$temp_dir/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          binary_path="$GITHUB_WORKSPACE/dist/release/stage/agentsmith_${VERSION}_darwin_arm64/asmith"

          echo "SIGNING_TEMP_DIR=$temp_dir" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

          op read 'op://Automation/Apple Developer App Store Connect AuthKey Github Releases/AuthKey.p8' --out-file "$temp_dir/AuthKey.p8"
          op read 'op://Automation/Apple Release Signing Developer ID Certificate/Apple Release Signing Developer ID Certificate.p12' --out-file "$temp_dir/developer-id.p12"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$temp_dir/developer-id.p12" -k "$keychain_path" -P "$APPLE_SIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity"

          codesign --force --deep --sign "$identity" --timestamp --options runtime "$binary_path"
          codesign --verify --deep --strict --verbose=2 "$binary_path"

          ditto -c -k --keepParent "$binary_path" "$temp_dir/notary.zip"
          xcrun notarytool submit "$temp_dir/notary.zip" \
            --key "$temp_dir/AuthKey.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --output-format json | tee "$temp_dir/notary-result.json"
          jq -e '.status == "Accepted"' "$temp_dir/notary-result.json"
          spctl -a -vvv -t install "$binary_path"

      - name: Package macOS artifact
        run: bun run release:package -- --target darwin-arm64 --version "$VERSION"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64
          path: dist/release/agentsmith_${{ env.VERSION }}_darwin_arm64.tar.gz
          if-no-files-found: error

      - name: Remove temporary keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          if [[ -n "${SIGNING_TEMP_DIR:-}" ]]; then
            rm -rf "$SIGNING_TEMP_DIR"
          fi

  linux:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            suffix: linux_amd64
          - target: linux-arm64
            suffix: linux_arm64
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux artifact
        run: bun run release:build -- --target "${{ matrix.target }}" --version "$VERSION"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/agentsmith_${{ env.VERSION }}_${{ matrix.suffix }}.tar.gz
          if-no-files-found: error

  publish:
    needs:
      - resolve
      - macos
      - linux
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Generate and verify checksums
        run: |
          cd dist/release
          shasum -a 256 agentsmith_*.tar.gz > checksums.txt
          shasum -a 256 -c checksums.txt

      - name: Upload GitHub release assets
        run: gh release upload "$TAG" dist/release/agentsmith_*.tar.gz dist/release/checksums.txt --clobber

  npm:
    needs:
      - resolve
      - publish
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish npm package
        run: npm publish

  homebrew:
    needs:
      - resolve
      - publish
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: release-darwin-arm64
          path: dist/release

      - name: Load Homebrew tap token
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: op://Automation/GitHub Token for homebrew-tap/token

      - name: Update Homebrew tap
        run: |
          archive="dist/release/agentsmith_${VERSION}_darwin_arm64.tar.gz"
          checksum="$(shasum -a 256 "$archive" | awk '{ print $1 }')"

          export GH_TOKEN="$HOMEBREW_TAP_GITHUB_TOKEN"
          gh auth setup-git
          gh repo clone niieani/homebrew-tap tap

          bun run homebrew:cask -- --version "$VERSION" --sha256 "$checksum" --output tap/Casks/agentsmith.rb
          ruby -c tap/Casks/agentsmith.rb

          git -C tap add Casks/agentsmith.rb
          if git -C tap diff --cached --quiet; then
            exit 0
          fi

          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap commit -m "agentsmith ${VERSION}"
          git -C tap push
